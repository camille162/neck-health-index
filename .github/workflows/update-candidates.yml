name: Auto-sync whitelisted channel content

on:
  schedule:
    # 每周一 04:37（北京时间）——如需更频繁，修改此行 cron 即可
    - cron: '37 20 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run fetch
      - name: Commit and push if new content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet src/data/contents.json; then
            echo "无新增内容，跳过提交。"
          else
            git add src/data/contents.json
            git commit -m "chore: 白名单渠道内容自动同步 $(date -u +%Y-%m-%d)"
            git push
          fi
